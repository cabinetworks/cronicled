[project]
name = "cronicled"
version = "0.1.0"
description = "An always-on companion for a self-hosted media library."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

# Documentation tooling ONLY. This is a dependency GROUP, not a dependency:
# `dependencies` above stays empty, nothing here is installed by `uv run` or by
# the container build, and the test suite still runs on a bare interpreter with
# none of it present. Build the site with `uv run --group docs mkdocs build`.
[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cronicled"]
