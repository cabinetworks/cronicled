name: ci
on:
  push:
    branches: [main]
    # Release tags publish a version-tagged image as well as the SHA-tagged
    # one. The publish job checks the tag against the declared version rather
    # than trusting the tag name.
    tags: ["v*"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone: the guard now scans tracked
          # file contents and commit messages at every commit, not just the
          # working tree, so it needs every commit object to be present.
          fetch-depth: 0
      - name: Leak guard
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          # The real discriminator: whether this run IS a pull request from
          # a fork. An empty LEAK_PATTERNS does NOT mean that - a fork PR is
          # only one of several ways the secret ends up empty (the others
          # being it deleted, renamed, expired, or scoped to the wrong
          # environment), and this workflow has no way to tell those apart
          # from the secret's value alone. Reduced (--file-types-only) mode
          # exists solely because a fork PR cannot read repository secrets
          # at all, by GitHub's own design - so it may be used ONLY when
          # this is genuinely a fork PR, never merely because the variable
          # came through empty. `github.event.pull_request` does not exist
          # on a `push` event, so this evaluates to `false` there rather
          # than erroring - a fork PR is impossible by construction on a
          # push to main, and an absent secret in that case must fail the
          # job loudly instead.
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ "${IS_FORK_PR}" = "true" ]; then
            echo "Fork pull request: LEAK_PATTERNS is not available to fork PRs by GitHub's own design."
            echo "Running file-type checks only; the full scan still runs on push to main."
            ./scripts/check_leaks --file-types-only
          elif [ -z "${LEAK_PATTERNS}" ]; then
            echo "::error::LEAK_PATTERNS is empty on a non-fork run (push, or a same-repo PR)." >&2
            echo "::error::That cannot legitimately happen here - only a fork PR is exempt from" >&2
            echo "::error::having this secret, and this is not one. The secret was deleted," >&2
            echo "::error::renamed, expired, or mis-scoped. Failing loudly rather than silently" >&2
            echo "::error::downgrading to file-type-only checks." >&2
            exit 1
          else
            ./scripts/check_leaks
          fi

  test:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests -t . -v

  container:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg PYTHON_VERSION="$(cat .python-version)" -t cronicled:ci .
      - name: The package runs inside the image
        run: docker run --rm cronicled:ci python -m cronicled.selfcheck

  # Build the documentation site on EVERY push and pull request, whether or not
  # it will be published, so a broken page or a dead internal link fails here
  # rather than on a deploy nobody is watching. mkdocs-material comes from the
  # `docs` dependency group and from nowhere else: the project's runtime
  # dependencies stay exactly Jinja2, and neither the `test` job above nor the
  # image installs any of this.
  docs:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the site
        # --strict turns a warning into a failure, which is the point of
        # running this on every commit: an internal link to a page that was
        # renamed is exactly the kind of rot that otherwise ships.
        run: uv run --frozen --group docs mkdocs build --strict
      - name: Keep the built site for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 1

  # Publish what the `docs` job built, to GitHub Pages.
  #
  # Deliberately NOT a Pages "build from a branch" setting: that would run
  # Jekyll on GitHub's side, outside this workflow, and
  # publish without ./scripts/check_leaks ever running against the commit
  # that produced the pages. Everything that reaches the open internet goes
  # through the guard first, which is why this needs it explicitly as well as
  # through `docs`.
  #
  # No secret is involved. Pages authenticates with the workflow's own OIDC
  # token, so there is nothing here that can be absent: a deploy needing a
  # repository secret has to decide what to do when it is missing, and this
  # one has no such state. That is also why a fork pull request is handled by
  # not matching the gate at all, rather than by explaining an absent secret.
  #
  # There are no preview deploys, because GitHub Pages has exactly one site
  # per repository and no concept of one. A pull request still BUILDS the site
  # in the `docs` job above, which is the check that catches a broken page or
  # a dead link; what it does not get is a URL to look at.
  docs-deploy:
    needs: [guard, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Fetch the site the docs job built
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Package it the way Pages expects
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4

  publish:
    # `needs: guard` is the one that must never be dropped: it is what makes
    # "published" and "scanned" the same set. `test` and `container` are here
    # too because an image that fails them is not worth a permanent tag.
    #
    # Everything that ends up in the image is tracked source the guard has
    # already scanned - the Dockerfile copies `cronicled/` and nothing else,
    # and .dockerignore excludes the rest. That property is what makes
    # publishing from CI safe at all, and it holds only while COPY and
    # .dockerignore agree; a new COPY line has to be checked against
    # .dockerignore before it ships to a public registry.
    needs: [guard, test, container]
    # Never from a pull request. Fork PRs cannot read repository secrets by
    # GitHub's design (see the guard job), and a pull request able to push an
    # image into the project's own namespace is a hole, not a feature. Pushes
    # to other branches are excluded for the same reason.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      # No new repository secret: the built-in token is enough to write to the
      # account's own package namespace, and there is nothing extra to rotate.
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the image tags and the pinned interpreter
        id: inputs
        run: |
          set -eu
          image=ghcr.io/cabinetworks/cronicled

          # There is deliberately NO `latest` tag, and this is not an
          # oversight to be helpfully corrected. `latest` is read as "the one
          # you want", and nobody pulls it expecting a program that imports a
          # package, prints a line and exits - which is all this image does
          # until there is a service to put in it. A commit SHA and a release
          # version make no such promise, so those are the only tags pushed.
          tags="${image}:${GITHUB_SHA}"

          case "${GITHUB_REF}" in
            refs/tags/v*)
              declared=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)
              tagged=${GITHUB_REF#refs/tags/v}
              if [ -z "${declared}" ]; then
                echo "::error::no version declared in pyproject.toml" >&2
                exit 1
              fi
              # A tag naming one version while pyproject declares another is
              # not a tie to break by preferring one of them: the published
              # image would be labelled with a version it was not built from.
              if [ "${declared}" != "${tagged}" ]; then
                echo "::error::release tag v${tagged} does not match the declared version ${declared}" >&2
                exit 1
              fi
              tags="${tags},${image}:${declared}"
              ;;
          esac

          printf 'tags=%s\n' "${tags}" >> "${GITHUB_OUTPUT}"
          # Passed to the build explicitly, exactly as the container job does.
          # The Dockerfile's own ARG default is a fallback for a hand build,
          # not a second declaration CI is allowed to lean on.
          printf 'interpreter=%s\n' "$(cat .python-version)" >> "${GITHUB_OUTPUT}"
      # The audience for a self-hosted media-library companion is on a NAS, a
      # small board or an Apple Silicon machine at least as often as on x86.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PYTHON_VERSION=${{ steps.inputs.outputs.interpreter }}
          tags: ${{ steps.inputs.outputs.tags }}
