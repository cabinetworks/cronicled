name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone: the guard now scans tracked
          # file contents and commit messages at every commit, not just the
          # working tree, so it needs every commit object to be present.
          fetch-depth: 0
      - name: Leak guard
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: ./scripts/check_leaks.sh

  test:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
