site_name: cronicled
site_description: >-
  A foundation for an always-on companion to a self-hosted media library.
site_url: https://cabinetworks.github.io/cronicled/
repo_url: https://github.com/cabinetworks/cronicled
edit_uri: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    # A light/dark toggle that starts from whatever the reader's system already
    # asks for, rather than imposing one and making them click.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  # The point of routing mermaid through superfences: the SAME ```mermaid fence
  # renders as a diagram here and on the repository page. Without this the site
  # would need its own diagram syntax, and the two copies would drift.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Architecture: index.md
  - Site adapters: adapters.md
  - Container: container.md
  - Leak guard: leak-guard.md
